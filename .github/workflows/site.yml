name: Verify and deploy Astro marketing site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atto-xo-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and smoke-test site
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify pinned lockfile checksum
        run: sha256sum --check tools/lockfile.sha256
      - name: Bootstrap pinned Lighthouse dependency lock (temporary)
        run: npm install --no-audit --no-fund
      - name: Export lockfile receipt (temporary)
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import crypto from 'node:crypto'; const data=fs.readFileSync('package-lock.json'); console.log('LIGHTHOUSE_LOCK_SHA256:'+crypto.createHash('sha256').update(data).digest('hex')); const b=data.toString('base64'); console.log('LIGHTHOUSE_LOCK_BEGIN'); for (let i=0;i<b.length;i+=1200) console.log('LIGHTHOUSE_LOCK_CHUNK:'+b.slice(i,i+1200)); console.log('LIGHTHOUSE_LOCK_END');"
      - name: Build static Astro pages
        run: npm run build
      - name: Run content, link, and compliance smoke tests
        run: npm test
      - name: Install Chromium browser and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Run real browser accessibility and responsive tests
        run: npm run test:e2e
      - name: Lighthouse mobile performance and accessibility lab gate
        run: npm run audit:lighthouse
      - name: Run preserved Rust guard tests
        run: cargo test --manifest-path tools/rust-bootstrap/Cargo.toml
      - name: Preserve browser QA evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: atto-xo-browser-evidence-${{ github.run_id }}
          path: qa-evidence/
          retention-days: 7
          if-no-files-found: error
      - name: Package Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
