name: Verify and deploy Astro marketing site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atto-xo-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and smoke-test site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Package-lock is pending first dependency resolution. npm install is intentional.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build static Astro pages
        run: npm run build
      - name: Run content, link, and compliance smoke tests
        run: npm test
      - name: Run preserved Rust guard tests
        run: cargo test --manifest-path tools/rust-bootstrap/Cargo.toml
      - name: Package Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish GitHub Pages
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
